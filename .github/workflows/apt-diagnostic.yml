name: Scoped APT diagnostic

# Temporary diagnostic, not integration acceptance or real-host evidence.
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/apt-diagnostic.yml
      - .github/diagnostics/**

permissions:
  contents: read

jobs:
  apt-diagnostic:
    if: github.event.pull_request.number == 63 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/issue-60-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact source and diagnostic tests
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          python3 -B .github/diagnostics/test_apt_probe.py
      - name: Reproduce only the APT preparation stage
        run: python3 -B .github/diagnostics/apt_probe.py --output "$RUNNER_TEMP/apt-diagnostic"
      - name: Retain only bounded redacted diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoped-apt-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/apt-diagnostic/apt-diagnostic.json
          retention-days: 3
          if-no-files-found: warn
